* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { min-height: 100%; font-family: 'Inter', 'Noto Sans SC', sans-serif; color: var(--thai-dark); background: radial-gradient(circle at 18% 15%, rgba(197,155,90,0.16), transparent 11%), radial-gradient(circle at 86% 10%, rgba(14,102,85,0.10), transparent 16%), linear-gradient(180deg, #f7efe5 0%, #fbf7f0 100%); background-attachment: fixed; }
.container { max-width: 1400px; margin: 0 auto; padding: 24px; display: grid; grid-template-columns: 380px 1fr; gap: 24px; min-height: 100vh; }

.sidebar { border-radius: 32px; border: 1px solid #d9c9a4; background: rgba(255,253,249,0.96); padding: 28px; box-shadow: 0 20px 60px rgba(32,30,24,0.12); display: flex; flex-direction: column; gap: 16px; max-height: calc(100vh - 48px); overflow: hidden; }
.sidebar h1 { font-family: 'Cormorant Garamond', Georgia, serif; font-size: 26px; color: #1f352f; font-weight: 600; }
.sidebar .subtitle { font-size: 12px; color: #716054; margin-top: 4px; line-height: 1.6; }

.search-box { border-radius: 18px; border: 1px solid #f0e4cf; background: #fff9f2; padding: 10px 12px; }
.search-box input { width: 100%; border-radius: 14px; border: 1px solid #d8b57b; padding: 10px 14px; font-size: 13px; outline: none; color: #3a372f; }
.search-box input:focus { border-color: var(--thai-teal); }

.filter-row { display: flex; flex-wrap: wrap; gap: 6px; }
.filter-btn { border-radius: 999px; padding: 5px 12px; font-size: 11px; font-weight: 500; border: none; cursor: pointer; transition: all 0.15s; background: #f5efe6; color: #6b5a45; }
.filter-btn:hover { background: #ebe0d0; }
.filter-btn.active { color: white; box-shadow: 0 2px 8px rgba(0,0,0,0.15); }

.sort-row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.sort-row select { border-radius: 14px; border: 1px solid #d8b57b; padding: 6px 10px; font-size: 12px; background: white; color: #3a372f; outline: none; }
.fav-toggle { border-radius: 14px; padding: 6px 12px; font-size: 12px; font-weight: 500; border: none; cursor: pointer; background: #f5efe6; color: #6b5a45; transition: all 0.15s; display: flex; align-items: center; gap: 4px; }
.fav-toggle:hover { background: #ebe0d0; }
.fav-toggle.active { background: var(--thai-gold); color: white; }

.place-list { flex: 1; overflow-y: auto; padding-right: 4px; display: flex; flex-direction: column; gap: 8px; min-height: 0; }
.place-list::-webkit-scrollbar { width: 6px; }
.place-list::-webkit-scrollbar-thumb { background: linear-gradient(180deg, var(--thai-gold), var(--thai-teal)); border-radius: 999px; }

.place-card { border-radius: 18px; border: 1px solid #ece0d1; background: #fff; padding: 12px 14px; cursor: pointer; transition: all 0.15s; box-shadow: 0 2px 8px rgba(30,26,19,0.05); }
.place-card:hover { box-shadow: 0 6px 18px rgba(30,26,19,0.1); transform: translateY(-1px); }
.place-card.active { border-color: rgba(13,102,84,0.35); background: #eef7f2; }
.place-card .header { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
.place-card h3 { font-size: 15px; font-weight: 600; color: #25322f; font-family: 'Cormorant Garamond', Georgia, serif; }
.place-card .desc { font-size: 12px; color: #726855; margin-top: 4px; line-height: 1.5; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.place-card .meta { display: flex; justify-content: space-between; align-items: center; margin-top: 6px; font-size: 11px; color: #8a6f51; }
.place-card .badges { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; }
.badge { border-radius: 999px; padding: 3px 8px; font-size: 10px; font-weight: 600; letter-spacing: 0.05em; }
.badge-michelin { background: #b08b4f; color: white; }
.badge-asia50 { background: #1565c0; color: white; }
.badge-blackpearl { background: #7b1fa2; color: white; }
.badge-other { background: #f0e0cc; color: #4a3825; }
.badge-cat { background: #e8f4f8; color: #1565c0; }

.fav-star { font-size: 16px; line-height: 1; cursor: pointer; background: none; border: none; padding: 2px; color: #d5c8b0; transition: color 0.15s; }
.fav-star.active { color: var(--thai-gold); }

.map-wrap { position: relative; border-radius: 36px; border: 1px solid #d7c4a4; background: #fbf6ef; padding: 12px; box-shadow: 0 24px 80px rgba(38,34,21,0.12); }
.map-inner { border-radius: 28px; overflow: hidden; height: calc(100vh - 72px); background: white; }
.leaflet-container { width: 100%; height: 100%; border-radius: 28px; }
.leaflet-popup-content-wrapper, .leaflet-popup-tip { background: #fff8f0; border: 1px solid rgba(197,155,90,0.35); border-radius: 18px; }

/* Detail Modal */
.detail-overlay { position: absolute; inset: 0; z-index: 2000; display: flex; justify-content: flex-end; align-items: flex-start; padding: 20px; pointer-events: none; }
.detail-modal { pointer-events: auto; width: 100%; max-width: 420px; max-height: 90vh; overflow-y: auto; border-radius: 32px; border: 1px solid #d9c9a4; background: #fffdf8; box-shadow: 0 24px 80px rgba(38,34,21,0.25); }

.detail-modal .content { padding: 24px; }
.detail-modal h2 { font-family: 'Cormorant Garamond', Georgia, serif; font-size: 26px; color: #1f352f; }
.detail-modal .info-block { margin-top: 16px; border-radius: 24px; border: 1px solid #f0e4cf; background: #fff9f2; padding: 20px; display: flex; flex-direction: column; gap: 14px; }
.detail-modal .info-row { display: flex; gap: 10px; align-items: flex-start; }
.detail-modal .info-row .icon { font-size: 18px; line-height: 1; margin-top: 2px; }

.detail-modal .info-row .value { font-size: 14px; color: #3d352f; margin-top: 2px; }
.detail-modal .actions { display: flex; gap: 10px; margin-top: 20px; }
.detail-modal .actions a, .detail-modal .actions button { flex: 1; text-align: center; padding: 12px; border-radius: 18px; font-size: 14px; font-weight: 600; text-decoration: none; cursor: pointer; border: none; }
.detail-modal .btn-primary { background: var(--thai-teal); color: white; }
.detail-modal .btn-secondary { background: white; color: #5d4a33; border: 1px solid #d8b57b; }
.detail-modal .close-btn { position: absolute; top: 16px; right: 16px; width: 36px; height: 36px; border-radius: 50%; background: rgba(255,255,255,0.9); border: none; cursor: pointer; font-size: 18px; color: #4a3825; display: flex; align-items: center; justify-content: center; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }

.stats-bar { border-radius: 20px; border: 1px solid #e7d9c2; background: #fcfaf6; padding: 14px 18px; font-size: 13px; color: #6f5f4a; display: flex; justify-content: space-between; }

.custom-icon { background: transparent !important; border: none !important; }
.custom-icon-inner { width: 28px; height: 28px; border-radius: 50%; border: 3px solid white; box-shadow: 0 2px 8px rgba(0,0,0,0.35); display: flex; align-items: center; justify-content: center; transition: all 0.25s ease; }
.custom-icon-inner::after { content: ''; width: 8px; height: 8px; background: white; border-radius: 50%; }
.custom-icon-active .custom-icon-inner { width: 36px; height: 36px; border-width: 4px; box-shadow: 0 0 0 6px rgba(255,255,255,0.4), 0 4px 16px rgba(0,0,0,0.4); }
.custom-icon-active .custom-icon-inner::after { width: 10px; height: 10px; }

/* Pulse ring for active marker */
.pulse-ring { position: absolute; width: 36px; height: 36px; border-radius: 50%; animation: pulse 1.8s infinite; pointer-events: none; }
@keyframes pulse {

  70% { transform: scale(2.2); opacity: 0; box-shadow: 0 0 0 12px rgba(197,155,90,0); }
  100% { transform: scale(2.2); opacity: 0; }

const categoryConfig = {
  all: { label: '全部', color: '#0d6554' },
  restaurant: { label: '餐厅', color: '#b08b4f' },
  cafe: { label: '咖啡馆', color: '#1565c0' },
  bar: { label: '酒吧', color: '#7b1fa2' },
  streetfood: { label: '街头美食', color: '#e65100' },
  other: { label: '本地推荐', color: '#836a55' }
};

const sourceLabels = { michelin: '米其林推荐', asia50: '亚洲前50榜', blackpearl: '黑珍珠榜', other: '本地推荐' };

let state = {
  search: '',
  category: 'all',
  showFav: false,
  sort: 'default',
  favs: JSON.parse(localStorage.getItem('bkk_favs') || '[]'),
  userLoc: null,
  activeId: null,
  selected: null
};

let map = null;
let markersLayer = null;
let markersMap = new Map();
let routeLayer = null; // Route planning line layer

function getDistanceKm(lat1, lng1, lat2, lng2) {
  const R = 6371;
  const dLat = (lat2 - lat1) * Math.PI / 180;
  const dLng = (lng2 - lng1) * Math.PI / 180;
  const a = Math.sin(dLat/2)**2 + Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLng/2)**2;
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}

function parseSource(source) {
  if (!source) return [];
  return String(source).split(',').map(s=>s.trim()).filter(Boolean).map(item=>{
    const parts = item.split('-');
    if (parts.length>1 && /^\d{4}$/.test(parts[0])) return { year: parts[0], base: parts.slice(1).join('-'), raw: item };
    return { year: null, base: item, raw: item };
  });
}

function formatSourceBadge(item) {
  const label = sourceLabels[item.base] || item.base;
  return item.year && item.base !== 'other' ? item.year + label : label;
}

function getBadgesHtml(place) {
  const items = parseSource(place.source);
  return items.map(item=>{
    const color = item.base==='michelin'?'#b08b4f':item.base==='asia50'?'#1565c0':item.base==='blackpearl'?'#7b1fa2':'#d8b192';
    const tc = item.base==='other'?'#4a3825':'white';
    return `<span class="badge" style="background:${color};color:${tc}">${formatSourceBadge(item)}</span>`;
  }).join('');
}

function toggleFav(id, e) {
  if (e) e.stopPropagation();
  const set = new Set(state.favs);
  if (set.has(id)) set.delete(id); else set.add(id);
  state.favs = Array.from(set);
  localStorage.setItem('bkk_favs', JSON.stringify(state.favs));
  render();
}

function filterPlaces() {
  let list = [...PLACES];
  const s = state.search.trim().toLowerCase();
  if (s) list = list.filter(p => (p.name+' '+p.short+' '+p.address).toLowerCase().includes(s));
  if (state.category !== 'all') list = list.filter(p => p.category === state.category);
  if (state.showFav) list = list.filter(p => state.favs.includes(p.id));
  if (state.sort === 'distance' && state.userLoc) {
    list = list.map(p => ({...p, _dist: getDistanceKm(state.userLoc.lat, state.userLoc.lng, p.lat, p.lng)})).sort((a,b)=>a._dist-b._dist);
  } else if (state.sort === 'name') {
    list = list.sort((a,b) => a.name.localeCompare(b.name));
  }
  return list;
}

function drawRoute(place) {
  if (routeLayer) { map.removeLayer(routeLayer); routeLayer = null; }
  if (!state.userLoc || !place.lat || !place.lng) return;
  routeLayer = L.layerGroup().addTo(map);
  // Draw dashed line from user location to place
  const latlngs = [
    [state.userLoc.lat, state.userLoc.lng],
    [place.lat, place.lng]
  ];
  L.polyline(latlngs, {
    color: '#c59b5a',
    weight: 3,
    opacity: 0.8,
    dashArray: '8, 8',
    lineCap: 'round'
  }).addTo(routeLayer);
  // Add user location marker
  L.circleMarker([state.userLoc.lat, state.userLoc.lng], {
    radius: 6,
    fillColor: '#1565c0',
    color: '#fff',
    weight: 2,
    opacity: 1,
    fillOpacity: 0.9
  }).bindTooltip('您的位置', {direction: 'top', offset: [0, -6]}).addTo(routeLayer);
}

function clearRoute() {
  if (routeLayer) { map.removeLayer(routeLayer); routeLayer = null; }
}

function openDetail(place) {
  state.selected = place;
  state.activeId = place.id;
  currentPhotoIndex = 0;
  render();
  drawRoute(place);
  const ov = document.getElementById('detailOverlay');
  const dist = state.userLoc ? getDistanceKm(state.userLoc.lat, state.userLoc.lng, place.lat, place.lng) : null;
  const distStr = dist ? (dist < 1 ? `${(dist*1000).toFixed(0)} 米` : `${dist.toFixed(1)} 公里`) : '';
  const photos = place.photos || [];
  const isFav = state.favs.includes(place.id);

  // Build photo gallery HTML
  let galleryHtml = '';
  if (photos.length > 0) {
    galleryHtml = `
      <div style="position:relative;width:100%;height:220px;overflow:hidden;border-radius:32px 32px 0 0;background:#f4efe6;">
        <img id="detailPhoto" src="${photos[0]}" style="width:100%;height:100%;object-fit:cover;display:block;" />
        ${photos.length > 1 ? `
          <button onclick="prevPhoto(${place.id})" style="position:absolute;left:12px;top:50%;transform:translateY(-50%);width:32px;height:32px;border-radius:50%;border:none;background:rgba(0,0,0,0.4);color:#fff;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;">‹</button>
          <button onclick="nextPhoto(${place.id})" style="position:absolute;right:12px;top:50%;transform:translateY(-50%);width:32px;height:32px;border-radius:50%;border:none;background:rgba(0,0,0,0.4);color:#fff;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;">›</button>
          <div id="photoCounter" style="position:absolute;bottom:12px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,0.35);color:#fff;padding:4px 12px;border-radius:999px;font-size:12px;">1 / ${photos.length}</div>
        ` : ''}
      </div>
    `;
  }

  ov.innerHTML = `
    <div class="detail-modal" data-place-id="${place.id}">
      ${galleryHtml}
      <button class="close-btn" onclick="closeDetail()">✕</button>
      <div class="content">
        <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:12px;">
          <div style="flex:1;min-width:0;">
            <h2 style="word-break:break-word;">${place.name}</h2>
            ${place.short ? `<p style="margin-top:8px;color:#716054;font-size:14px;line-height:1.6;">${place.short}</p>` : ''}
          </div>
          <button class="fav-star ${isFav?'active':''}" onclick="toggleFav(${place.id});event.stopPropagation();" style="font-size:24px;flex-shrink:0;">${isFav?'★':'☆'}</button>
        </div>
        <div style="margin-top:14px;display:flex;flex-wrap:wrap;gap:6px;">${getBadgesHtml(place)}${place.category && place.category!=='other' ? `<span class="badge badge-cat">${categoryConfig[place.category]?.label||place.category}</span>` : ''}</div>
        <div class="info-block">
          ${place.address ? `<div class="info-row"><span class="icon">📍</span><div><div class="label">地址</div><div class="value">${place.address}</div></div></div>` : ''}
          ${distStr ? `<div class="info-row"><span class="icon">🧭</span><div><div class="label">距离</div><div class="value">${distStr}</div></div></div>` : ''}
          ${place.hours ? `<div class="info-row"><span class="icon">🕒</span><div><div class="label">营业时间</div><div class="value">${place.hours}</div></div></div>` : ''}
          ${place.phone ? `<div class="info-row"><span class="icon">📞</span><div><div class="label">电话</div><div class="value">${place.phone}</div></div></div>` : ''}
          ${place.avgPrice ? `<div class="info-row"><span class="icon">💰</span><div><div class="label">人均消费</div><div class="value">${place.avgPrice}</div></div></div>` : ''}
        </div>
        <div class="actions">
          ${place.website ? `<a href="${place.website}" target="_blank" rel="noreferrer" class="btn-primary">访问官网 / 预约</a>` : ''}
          <a href="https://www.google.com/maps/search/?api=1&query=${place.lat},${place.lng}" target="_blank" rel="noreferrer" class="btn-secondary">地图导航</a>
        </div>
      </div>
    </div>
  `;
  ov.style.display = 'flex';
  if (map && place.lat && place.lng) map.setView([place.lat, place.lng], 15, {animate:true});
  // Scroll list to active card
  setTimeout(() => {
    const activeCard = document.querySelector('.place-card.active');
    if (activeCard) activeCard.scrollIntoView({behavior: 'smooth', block: 'nearest'});
  }, 50);
}

let currentPhotoIndex = 0;
function nextPhoto(placeId) {
  const place = PLACES.find(p => p.id === placeId);
  if (!place || !place.photos || place.photos.length <= 1) return;
  currentPhotoIndex = (currentPhotoIndex + 1) % place.photos.length;
  const img = document.getElementById('detailPhoto');
  const counter = document.getElementById('photoCounter');
  if (img) img.src = place.photos[currentPhotoIndex];
  if (counter) counter.textContent = `${currentPhotoIndex + 1} / ${place.photos.length}`;
}
function prevPhoto(placeId) {
  const place = PLACES.find(p => p.id === placeId);
  if (!place || !place.photos || place.photos.length <= 1) return;
  currentPhotoIndex = (currentPhotoIndex - 1 + place.photos.length) % place.photos.length;
  const img = document.getElementById('detailPhoto');
  const counter = document.getElementById('photoCounter');
  if (img) img.src = place.photos[currentPhotoIndex];
  if (counter) counter.textContent = `${currentPhotoIndex + 1} / ${place.photos.length}`;
}

function closeDetail() {
  document.getElementById('detailOverlay').style.display = 'none';
  state.selected = null;
  state.activeId = null;
  currentPhotoIndex = 0;
  clearRoute();
  render();
}

function clickCard(place) {
  state.activeId = place.id;
  openDetail(place);
}

function render() {
  const list = filterPlaces();
  document.getElementById('statsCount').textContent = `${list.length} / ${PLACES.length}`;
  document.getElementById('favCount').textContent = state.favs.length ? `(${state.favs.length})` : '';
  document.getElementById('placeList').innerHTML = list.map(p => {
    const isFav = state.favs.includes(p.id);
    const dist = p._dist ? (p._dist < 1 ? `${(p._dist*1000).toFixed(0)}m` : `${p._dist.toFixed(1)}km`) : '';
    return `
      <div class="place-card ${state.activeId===p.id?'active':''}" onclick="clickCard(PLACES.find(x=>x.id===${p.id}))">
        <div class="header">
          <div>
            <h3>${p.name} ${dist?`<span style="font-size:12px;color:#8a6f51;font-weight:400;">${dist}</span>`:''}</h3>
          </div>
          <button class="fav-star ${isFav?'active':''}" onclick="toggleFav(${p.id},event)">${isFav?'★':'☆'}</button>
        </div>
        <p class="desc">${p.short || ''}</p>
        <div class="badges">${getBadgesHtml(p)}${p.category && p.category!=='other' ? `<span class="badge badge-cat">${categoryConfig[p.category]?.label||p.category}</span>` : ''}</div>
        <div class="meta"><span>${p.address || ''}</span><span>#${p.id}</span></div>
      </div>
    `;
  }).join('');
  renderMapMarkers();
}

function renderMapMarkers() {
  if (!map) return;
  const list = filterPlaces();
  if (markersLayer) { map.removeLayer(markersLayer); markersMap.clear(); }
  markersLayer = L.layerGroup().addTo(map);
  list.forEach(p => {
    if (!p.lat || !p.lng) return;
    const isActive = state.activeId === p.id;
    const color = categoryConfig[p.category]?.color || categoryConfig.other.color;
    const size = isActive ? 36 : 28;
    const anchor = isActive ? 18 : 14;
    const icon = L.divIcon({
      className: 'custom-icon ' + (isActive ? 'custom-icon-active' : ''),
      html: isActive
        ? `<div style="position:relative;width:${size}px;height:${size}px;"><div class="pulse-ring" style="background:${color};"></div><div class="custom-icon-inner" style="background:${color};width:${size}px;height:${size}px;"></div></div>`
        : `<div class="custom-icon-inner" style="background:${color};"></div>`,
      iconSize: [size, size],
      iconAnchor: [anchor, anchor],
      popupAnchor: [0, -anchor]
    });
    const m = L.marker([p.lat, p.lng], {icon}).addTo(markersLayer);
    m.bindTooltip(p.name, {direction: 'top', offset: [0, -anchor]});
    // Click marker → open detail panel
    m.on('click', () => {
      state.activeId = p.id;
      openDetail(p);
    });
    markersMap.set(String(p.id), m);
  });
}

function init() {
  map = L.map('map', {center: [13.7563, 100.5018], zoom: 12, zoomControl: false});
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {attribution: '&copy; OpenStreetMap', maxZoom: 19}).addTo(map);
  L.control.zoom({position: 'bottomright'}).addTo(map);

  // Click on map blank area → deselect
  map.on('click', (e) => {
    if (e.originalEvent.target.closest('.leaflet-marker-icon')) return;
    state.activeId = null;
    state.selected = null;
    closeDetail();
    render();
  });

  if (navigator.geolocation) {
    navigator.geolocation.getCurrentPosition(pos=>{
      state.userLoc = {lat: pos.coords.latitude, lng: pos.coords.longitude};
      render();
    }, ()=>{});
  }

  document.getElementById('searchInput').addEventListener('input', e=>{ state.search = e.target.value; render(); });
  document.getElementById('sortSelect').addEventListener('change', e=>{ state.sort = e.target.value; render(); });
  document.getElementById('favToggle').addEventListener('click', ()=>{ state.showFav = !state.showFav; document.getElementById('favToggle').classList.toggle('active', state.showFav); render(); });

  document.getElementById('categoryFilters').addEventListener('click', e=>{
    if (!e.target.classList.contains('filter-btn')) return;
    document.querySelectorAll('#categoryFilters .filter-btn').forEach(b=>{ b.classList.remove('active'); b.style.background=''; b.style.color=''; });
    e.target.classList.add('active');
    e.target.style.background = categoryConfig[e.target.dataset.cat]?.color || '#0d6554';
    e.target.style.color = 'white';
    state.category = e.target.dataset.cat;
    render();
  });

  // Set initial active category color
  document.querySelector('[data-cat="all"]').style.background = categoryConfig.all.color;
  document.querySelector('[data-cat="all"]').style.color = 'white';

  document.addEventListener('keydown', e=>{ if (e.key==='Escape') closeDetail(); });

  // Click overlay background to close detail
  document.getElementById('detailOverlay').addEventListener('click', (e) => {
    if (e.target === e.currentTarget) closeDetail();
  });

  render();
}

init();
</script>
</body>
</html>
